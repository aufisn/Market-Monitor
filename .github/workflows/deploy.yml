name: Deploy
on:
  workflow_dispatch:
    inputs:
      emergency_override:
        description: "Emergency: skip the 08:30-16:30 New York deploy freeze (FR-14.2)"
        type: boolean
        default: false
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    # Skipped until setup is finished: set the repository variable DEPLOY_ENABLED=true
    # once the Cloudflare secrets and the D1 database id are in place.
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Deploy freeze (FR-14.2)
        run: node scripts/deploy-freeze.mjs
        env:
          MM_EMERGENCY_DEPLOY: ${{ inputs.emergency_override && '1' || '0' }}
      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
